<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madrid Toponymy - Why Places Are Named the Way They Are</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="hero-bg"></div>
  <div class="container hero-content">
    <span class="hero-eyebrow">Open dataset</span>
    <h1>Madrid<br>Toponymy</h1>
    <p class="subtitle">An etymological atlas of 475 place names &mdash; metro stations,
      streets, districts, plazas, parks &mdash; tracing why each is named the way it is.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="container">
  <section class="controls" id="controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/></svg>
      <input type="search" id="search" placeholder="Search names, etymologies, people, places..." autocomplete="off">
    </div>
    <div class="filter-row">
      <div class="filter-pills" id="category-pills">
        <button class="pill active" data-v="">All</button>
        <button class="pill" data-v="metro">Metro</button>
        <button class="pill" data-v="cercanias">Cercanias</button>
        <button class="pill" data-v="metro_ligero">ML / Tranvia</button>
        <button class="pill" data-v="districts">Districts</button>
        <button class="pill" data-v="neighbourhoods">Barrios</button>
        <button class="pill" data-v="plazas_parks">Plazas</button>
        <button class="pill" data-v="streets">Streets</button>
      </div>
      <div class="filter-selects">
        <select id="filter-type">
          <option value="">All types</option>
          <option value="person">Person</option>
          <option value="place">Place</option>
          <option value="descriptive">Descriptive</option>
          <option value="historical">Historical</option>
          <option value="religious">Religious</option>
          <option value="event">Event</option>
          <option value="occupation">Occupation</option>
          <option value="mythological">Mythological</option>
          <option value="unknown">Unknown</option>
        </select>
        <select id="filter-confidence">
          <option value="">All confidence</option>
          <option value="verified">Verified</option>
          <option value="probable">Probable</option>
          <option value="uncertain">Uncertain</option>
        </select>
      </div>
    </div>
    <div class="result-count" id="result-count"></div>
  </section>

  <div id="entries" class="entries"></div>
</main>

<footer>
  <div class="container">
    <div class="footer-inner">
      <div>
        <strong>Madrid Toponymy Dataset</strong><br>
        <span class="footer-note">475 hand-curated etymologies &middot; CC-BY-SA 4.0</span>
      </div>
      <div class="footer-links">
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">License</a>
      </div>
    </div>
  </div>
</footer>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
